<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>PaaS Lab - Azure Static Web App</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    
    <style>
        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: linear-gradient(135deg, #0078D4, #00B4D8);
            color: white;
            text-align: center;
        }

        header {
            padding: 40px 20px;
        }

        h1 {
            font-size: 40px;
            margin-bottom: 10px;
        }

        p {
            font-size: 18px;
        }

        .container {
            background: white;
            color: #333;
            margin: 40px auto;
            padding: 30px;
            border-radius: 10px;
            width: 80%;
            max-width: 600px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.2);
        }

        button {
            background-color: #0078D4;
            color: white;
            border: none;
            padding: 12px 25px;
            font-size: 16px;
            border-radius: 5px;
            cursor: pointer;
            transition: 0.3s;
        }

        button:hover {
            background-color: #005a9e;
        }

        footer {
            margin-top: 40px;
            padding: 20px;
            font-size: 14px;
            opacity: 0.8;
        }
    </style>
</head>

<body>

    <header>
        <h1>Azure Static Web App</h1>
        <p>Laboratory Work 02 - PaaS Deployment</p>
    </header>

    <div class="container">
        <h2>Welcome!</h2>
        <p><b>Updated:</b> Version 2 — deployed from GitHub ✅</p>
        <p>This is my single-file HTML page created for Task 1.3.</p>
        <p>It will be deployed using Azure Static Web Apps.</p>
        
        <button onclick="showMessage()">Click Me</button>
    </div>

    <footer>
        Created by: Karina Autukas | 2026
    </footer>

    <script>
        function showMessage() {
            alert("Success! Your static web app is working 🚀");
        }
    </script>

</body>
</html>
